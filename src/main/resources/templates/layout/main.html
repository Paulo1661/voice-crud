<!DOCTYPE html>
<html th:lang="|${#locale.language}-${#locale.country}|"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
    
</head>
<body>
<main layout:fragment="content">
</main>
<footer class="flex justify-center">
    <div class="flex max-w-[960px] flex-1 flex-col">
        <footer class="flex flex-col gap-6 px-5 py-10 text-center @container">
            <p class="text-[#637988] text-base font-normal leading-normal">@2025 PLE. All rights reserved.</p>
        </footer>
    </div>
</footer>
<script>
    function webrtcHandler() {
        return {
            rtcConnected: false,
            async toggleConnection() {
                if (!this.rtcConnected) {
                    await initializeWebRTC();
                    this.rtcConnected = true;
                } else {
                    stopWebRTC();
                    this.rtcConnected = false;
                }
            }
        }
    }
</script>
<script type="text/javascript" th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<th:block layout:fragment="script-content">

</th:block>
</body>
</html>
